spring:
  cloud:
    config:
      server:
        git:
          uri: https://github.com/ums-messaging/config-file-server.git
          default-label: main
          clone-on-start: true
          force-pull: true
  config:
    activate:
      on-profile: local
logging:
  level:
    org.springframework.cloud.config.server: TRACE
    org.eclipse.jgit: TRACE
    